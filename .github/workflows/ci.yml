# JARVIS — Continuous Integration
# Push/pull-request basina: ruff lint kapisi + tam birim test paketi (offscreen Qt).
name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  desktop:
    name: Desktop app (PySide6)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: "offscreen"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint gate (ruff — error-class rules)
        run: python -m ruff check .

      - name: Unit tests (desktop suite)
        run: python -m unittest discover -s tests -v

  pc-agent:
    name: Platform pc-agent (FastAPI)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform/pc-agent
    env:
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: platform/pc-agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint gate (ruff — error-class rules)
        run: python -m ruff check .

      - name: Unit tests (pc-agent suite, 34)
        run: python -m pytest tests/ -q
